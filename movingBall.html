<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Ball Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        #box{
            position: relative;
            width: 800px;
            height: 40px;
            padding: 10px;
            background: skyblue;
            border: 5px solid darkblue;
        }
        #ball{
            position: absolute;
            left: 0;
            top: 0;
            height: 30px;
            width: 30px;
            background-color: red;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div class="p-3">
        <div id="box">
            <div id="ball"></div>
        </div>
    <div class="btn btn-info mt-3" onclick="start()">Start</div>
    <div class="btn btn-danger mt-3" onclick="stop()">Stop</div>
    </div>
    
</body>
<script>
    let ball = document.querySelector('#ball');

    let left = 0;
    let direction = "right";
    let interval = setInterval(move, 10)

    // setInterval( () => {
    //     left += 1
    //     if(left > 790) left = 0
    //     ball.style.left = `${left}px`
    // }, 10)

    function move() {
        if(direction === "right") {
            left += 1
            if(left > 760) direction = "left"
        }else{
            left -= 1
            if(left < 1) direction = "right"
        }
        ball.style.left = `${left}px`
    }

    function start() {
        interval = setInterval(move, 10)
    }
    function stop() {
        clearInterval(interval)
    }

</script>
</html>
