<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moving Ball Game</title>
    <style>
        #box{
            position: relative;
            width: 800px;
            height: 30px;
            padding: 10px;
            background: skyblue;
            border: 5px solid darkblue;
        }
        #ball{
            position: absolute;
            /* 
            left: 0;
            top: 0;
            */
            height: 30px;
            width: 30px;
            background-color: red;
            border-radius: 30px;
        }
    </style>
</head>
<body>
    <div id="box">
        <div id="ball"></div>
    </div>
</body>
</html>
