<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Practice</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="card">
        <div class="card-body">
            <div class="c1">
                <h1>Background Changer</h1>
                <button type="button" id="primary" class="btn btn-primary">Primary</button>
                <button type="button" id="success" class="btn btn-success">Success</button>
                <button type="button" id="info" class="btn btn-info">Info</button>
                <button type="button" id="warning" class="btn btn-warning">Warning</button>
                <button type="button" id="danger" class="btn btn-danger">Danger</button>
            </div>
        </div>
    </div>
</body>
<script>
    var buttons = document.querySelectorAll('.btn');
    var body = document.querySelector('body');
    // console.log(buttons);
    buttons.forEach(function(button) {
        // console.log(button);
        button.addEventListener('click',function(e) {
            // console.log(e);
            // console.log(e.target.id);
            switch(e.target.id){
                case 'primary':
                    body.style.backgroundColor = '#0d6efd';
                    break;
                case 'success':
                    body.style.backgroundColor = '#198754';
                    break;
                case 'info':
                    body.style.backgroundColor = '#0dcaf0';
                    break;
                case 'warning':
                    body.style.backgroundColor = '#ffc107';
                    break;
                case 'danger':
                    body.style.backgroundColor = '#dc3545';
                    break;
            }
            
        });
        
    });
    
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</html>
